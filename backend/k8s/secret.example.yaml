# Shape only. Every value here is empty and must stay empty in git. AGENTS.md 5.2.
#
# To create the real secret, never by editing this file:
#
#   kubectl -n ebbatrust create secret generic api-secrets \
#     --from-literal=SUPABASE_URL='https://<ref>.supabase.co' \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY='...' \
#     --from-literal=SUPABASE_JWT_SECRET='...'
#
# The service-role key bypasses RLS entirely. It belongs to this service and nowhere else —
# never in the mobile bundle, never in a ConfigMap, never in a commit.

apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: ebbatrust
type: Opaque
stringData:
  SUPABASE_URL: ''
  SUPABASE_SERVICE_ROLE_KEY: ''
  # Used to verify the JWT the app receives from Supabase phone OTP sign-in.
  SUPABASE_JWT_SECRET: ''
