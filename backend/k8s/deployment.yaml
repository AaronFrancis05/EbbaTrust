apiVersion: v1
kind: Namespace
metadata:
  name: ebbatrust
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: ebbatrust
data:
  NODE_ENV: production
  PORT: '8080'
  HOST: 0.0.0.0
  LOG_LEVEL: info
  # The go-live switch (AGENTS.md 4.3). Flipping this to "live" with no provider implemented
  # makes every adapter call throw — which is the intended behaviour, not a bug.
  ADAPTER_MODE: mock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebbatrust-api
  namespace: ebbatrust
  labels:
    app.kubernetes.io/name: ebbatrust-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ebbatrust-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebbatrust-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ebbatrust/api:dev
          # The image is built locally and never pushed, so the node must not try a registry.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
            # Created from secret.example.yaml with real values — never committed.
            # Still marked optional so `kubectl apply` of this file alone succeeds, but the
            # pod will not become ready without DATABASE_URL in it. See secret.example.yaml.
            - secretRef:
                name: api-secrets
                optional: true
          # Liveness restarts a wedged process. Readiness only removes the pod from the
          # Service. Pointing both at the same endpoint would turn a blip into a restart loop,
          # so /health and /ready are separate routes.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
      # server.ts closes in-flight requests on SIGTERM; give it room to finish.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ebbatrust-api
  namespace: ebbatrust
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ebbatrust-api
  ports:
    - name: http
      port: 80
      targetPort: http
