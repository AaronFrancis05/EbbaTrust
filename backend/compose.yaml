# Local development stack.
#
# This is what you run day to day. The Kubernetes manifests in k8s/ run the same image and
# exist so the deployment target is not a surprise at Step 9 — not because a cluster is needed
# to develop against one service.

services:
  # Local Postgres with PostGIS. The hosted Supabase project is the real data layer
  # (PLAN.md 3.1); this exists so migrations are proven against a throwaway database before
  # they touch a project anyone depends on, and so `db:reset` is a real option.
  #
  # The credentials here are local-only and deliberately boring. Nothing in this file is a
  # secret, and nothing in this file may ever become one. AGENTS.md 5.2.
  db:
    image: postgis/postgis:17-3.5
    container_name: ebbatrust-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebbatrust
      POSTGRES_PASSWORD: ebbatrust
      POSTGRES_DB: ebbatrust
      # psql inside this container is how backend/db/apply.mjs talks to any database.
      PGUSER: ebbatrust
      PGDATABASE: ebbatrust
    ports:
      # Exposed so a GUI client can look at it. The API reaches it over the compose network.
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ebbatrust -d ebbatrust']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ebbatrust/api:dev
    container_name: ebbatrust-api
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: development
      PORT: '8080'
      HOST: 0.0.0.0
      LOG_LEVEL: debug
      # mock until an agreement, licence and credentials exist. See AGENTS.md 4.3.
      ADAPTER_MODE: mock
      # Inside the compose network the host is the service name, not localhost.
      DATABASE_URL: postgres://ebbatrust:ebbatrust@db:5432/ebbatrust
    depends_on:
      db:
        condition: service_healthy
    # Real values live in backend/.env, which is gitignored and never committed.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  db-data:
